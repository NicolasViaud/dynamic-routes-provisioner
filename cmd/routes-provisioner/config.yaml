datasource:
  provider: "mongodb"                   # ROUTES_DATASOURCE_PROVIDER
  uri: "mongodb://localhost:27017"      # ROUTES_DATASOURCE_URI
  database: "mydb"                      # ROUTES_DATASOURCE_DATABASE
  collection: "workspace"              # ROUTES_DATASOURCE_COLLECTION

certificate:
  provider: "selfsigned"                # ROUTES_CERTIFICATE_PROVIDER — "acme-http", "acme-dns", or "selfsigned"
  # --- acme-http / acme-dns common settings ---
  email: "admin@example.com"            # ROUTES_CERTIFICATE_EMAIL
  directory_url: "https://acme-staging-v02.api.letsencrypt.org/directory"  # ROUTES_CERTIFICATE_DIRECTORY_URL
  # --- acme-http only ---
  challenge_port: 80                    # ROUTES_CERTIFICATE_CHALLENGE_PORT
  # --- selfsigned only ---
  validity: "8760h"                     # ROUTES_CERTIFICATE_VALIDITY — default 1 year
  organization: "Self-Signed"           # ROUTES_CERTIFICATE_ORGANIZATION

certificate_store:
  enabled: false                    # ROUTES_CERTIFICATE_STORE_ENABLED — cache certs in K8s Secrets
  provider: "kube"                  # ROUTES_CERTIFICATE_STORE_PROVIDER — "kube"
  namespace: "default"              # ROUTES_CERTIFICATE_STORE_NAMESPACE
  secret_prefix: "route-tls"       # ROUTES_CERTIFICATE_STORE_SECRET_PREFIX
  renew_before: "720h"             # ROUTES_CERTIFICATE_STORE_RENEW_BEFORE — re-issue 30 days before expiry

provisioner:
  provider: "netscaler"                 # ROUTES_PROVISIONER_PROVIDER
  endpoint: "https://10.0.0.1"         # ROUTES_PROVISIONER_ENDPOINT
  username: "nsroot"                    # ROUTES_PROVISIONER_USERNAME
  password: "secret"                    # ROUTES_PROVISIONER_PASSWORD
  insecure_skip_verify: true            # ROUTES_PROVISIONER_INSECURE_SKIP_VERIFY

reconcile:
  interval: "5m"  # ROUTES_RECONCILE_INTERVAL — how often to reconcile desired vs actual state

leader_election:
  enabled: false          # ROUTES_LEADER_ELECTION_ENABLED — enable leader election for HA
  provider: "kube"        # ROUTES_LEADER_ELECTION_PROVIDER — "kube" or "mongo"
  lease_name: "routes-provisioner-leader"  # ROUTES_LEADER_ELECTION_LEASE_NAME
  # --- kube settings ---
  namespace: "default"    # ROUTES_LEADER_ELECTION_NAMESPACE — Kubernetes namespace for the Lease
  renew_deadline: "10s"   # ROUTES_LEADER_ELECTION_RENEW_DEADLINE
  # --- common settings ---
  lease_duration: "15s"   # ROUTES_LEADER_ELECTION_LEASE_DURATION
  retry_interval: "2s"    # ROUTES_LEADER_ELECTION_RETRY_INTERVAL
