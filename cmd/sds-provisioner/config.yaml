mongodb:
  uri: "mongodb://localhost:27017"
  database: "mydb"
  collection: "workspace"

acme:
  email: "admin@example.com"
  directory_url: "https://acme-staging-v02.api.letsencrypt.org/directory"
  challenge_port: 80

netscaler:
  endpoint: "https://10.0.0.1"
  username: "nsroot"
  password: "secret"
  insecure_skip_verify: true

reconcile:
  interval: "5m"  # SDS_RECONCILE_INTERVAL — how often to reconcile desired vs actual state

leader_election:
  enabled: false          # SDS_LEADER_ELECTION_ENABLED — enable leader election for HA
  lease_name: "sds-provisioner-leader"  # SDS_LEADER_ELECTION_LEASE_NAME
  namespace: "default"    # SDS_LEADER_ELECTION_NAMESPACE — Kubernetes namespace for the Lease
  lease_duration: "15s"   # SDS_LEADER_ELECTION_LEASE_DURATION
  renew_deadline: "10s"   # SDS_LEADER_ELECTION_RENEW_DEADLINE
  retry_interval: "2s"    # SDS_LEADER_ELECTION_RETRY_INTERVAL
